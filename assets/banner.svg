<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 280" width="880" height="280" role="img" aria-label="alpaca: a machine running ollama streaming tokens to client terminals over lan, tailnet, and tls">
  <title>alpaca — one machine serves the model, every other machine talks to it</title>
  <!-- Same manga page as the banner: flat black ink on white, screentone in
       the corners, boxes drawn like panels. The routes still carry their
       animated tokens — the page is still alive, just in ink. -->

  <defs>
    <pattern id="tone" width="11" height="11" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.7" fill="#000"/>
    </pattern>
    <clipPath id="page">
      <rect x="18" y="18" width="844" height="244"/>
    </clipPath>
  </defs>

  <!-- The page -->
  <rect width="880" height="280" fill="#fff"/>
  <g clip-path="url(#page)">
    <polygon points="18,18 250,18 18,105" fill="url(#tone)"/>
    <polygon points="862,262 862,175 630,262" fill="url(#tone)"/>
  </g>

  <!-- ─────────────  routes  ───────────── -->
  <!-- Dashed rails, arrowheads at the listening end, tokens in flight. -->
  <g fill="none" stroke="#000" stroke-width="2.5" stroke-dasharray="2 7" stroke-linecap="round">
    <path d="M280,140 C 420,140 490,74 606,74"/>
    <path d="M280,140 L 606,140"/>
    <path d="M280,140 C 420,140 490,206 606,206"/>
  </g>
  <g fill="#000">
    <polygon points="622,74 606,67 606,81"/>
    <polygon points="622,140 606,133 606,147"/>
    <polygon points="622,206 606,199 606,213"/>
  </g>

  <g fill="#000">
    <!-- lan -->
    <circle r="4" opacity="0">
      <animateMotion dur="2.7s" begin="0s" repeatCount="indefinite" path="M280,140 C 420,140 490,74 606,74"/>
      <animate attributeName="opacity" dur="2.7s" begin="0s" repeatCount="indefinite"
               values="0;1;1;0" keyTimes="0;0.12;0.86;1"/>
    </circle>
    <circle r="4" opacity="0">
      <animateMotion dur="2.7s" begin="1.35s" repeatCount="indefinite" path="M280,140 C 420,140 490,74 606,74"/>
      <animate attributeName="opacity" dur="2.7s" begin="1.35s" repeatCount="indefinite"
               values="0;1;1;0" keyTimes="0;0.12;0.86;1"/>
    </circle>

    <!-- tailnet -->
    <circle r="4" opacity="0">
      <animateMotion dur="2.7s" begin="0.45s" repeatCount="indefinite" path="M280,140 L 606,140"/>
      <animate attributeName="opacity" dur="2.7s" begin="0.45s" repeatCount="indefinite"
               values="0;1;1;0" keyTimes="0;0.12;0.86;1"/>
    </circle>
    <circle r="4" opacity="0">
      <animateMotion dur="2.7s" begin="1.8s" repeatCount="indefinite" path="M280,140 L 606,140"/>
      <animate attributeName="opacity" dur="2.7s" begin="1.8s" repeatCount="indefinite"
               values="0;1;1;0" keyTimes="0;0.12;0.86;1"/>
    </circle>

    <!-- tls -->
    <circle r="4" opacity="0">
      <animateMotion dur="2.7s" begin="0.9s" repeatCount="indefinite" path="M280,140 C 420,140 490,206 606,206"/>
      <animate attributeName="opacity" dur="2.7s" begin="0.9s" repeatCount="indefinite"
               values="0;1;1;0" keyTimes="0;0.12;0.86;1"/>
    </circle>
    <circle r="4" opacity="0">
      <animateMotion dur="2.7s" begin="2.25s" repeatCount="indefinite" path="M280,140 C 420,140 490,206 606,206"/>
      <animate attributeName="opacity" dur="2.7s" begin="2.25s" repeatCount="indefinite"
               values="0;1;1;0" keyTimes="0;0.12;0.86;1"/>
    </circle>
  </g>

  <!-- ─────────────  the machine with the model  ───────────── -->
  <g font-family="ui-monospace, 'Cascadia Mono', 'Courier New', monospace">
    <rect x="56" y="84" width="224" height="112" fill="#fff" stroke="#000" stroke-width="4"/>

    <!-- running indicator, pulsing in ink -->
    <circle cx="82" cy="113" r="5" fill="#000">
      <animate attributeName="opacity" dur="2.4s" repeatCount="indefinite"
               values="1;0.35;1" keyTimes="0;0.5;1"/>
    </circle>
    <circle cx="82" cy="113" r="5" fill="none" stroke="#000">
      <animate attributeName="r" dur="2.4s" repeatCount="indefinite" values="5;12;5"/>
      <animate attributeName="opacity" dur="2.4s" repeatCount="indefinite" values="0.6;0;0.6"/>
    </circle>

    <text x="98" y="119" font-size="18" font-weight="800" fill="#000">ollama</text>
    <text x="76" y="147" font-size="12.5" fill="#000">llama3.2:latest</text>
    <text x="76" y="176" font-size="14" font-weight="700" fill="#000">$ alpaca serve</text>
  </g>

  <!-- ─────────────  the other machines  ───────────── -->
  <g font-family="ui-monospace, 'Cascadia Mono', 'Courier New', monospace" font-size="12.5">
    <!-- lan -->
    <rect x="628" y="48" width="196" height="52" fill="#fff" stroke="#000" stroke-width="3.5"/>
    <text x="646" y="79" fill="#000">alpaca chat <tspan font-weight="700">█<animate attributeName="opacity" dur="1.1s" begin="0s" repeatCount="indefinite" values="1;1;0;0" keyTimes="0;0.5;0.5;1"/></tspan></text>
    <rect x="762" y="38" width="50" height="20" fill="#fff" stroke="#000" stroke-width="2.5"/>
    <text x="787" y="52" font-size="11" font-weight="700" fill="#000" text-anchor="middle">lan</text>

    <!-- tailnet -->
    <rect x="628" y="114" width="196" height="52" fill="#fff" stroke="#000" stroke-width="3.5"/>
    <text x="646" y="145" fill="#000">alpaca chat <tspan font-weight="700">█<animate attributeName="opacity" dur="1.1s" begin="0.37s" repeatCount="indefinite" values="1;1;0;0" keyTimes="0;0.5;0.5;1"/></tspan></text>
    <rect x="742" y="104" width="70" height="20" fill="#fff" stroke="#000" stroke-width="2.5"/>
    <text x="777" y="118" font-size="11" font-weight="700" fill="#000" text-anchor="middle">tailnet</text>

    <!-- tls -->
    <rect x="628" y="180" width="196" height="52" fill="#fff" stroke="#000" stroke-width="3.5"/>
    <text x="646" y="211" fill="#000">alpaca chat <tspan font-weight="700">█<animate attributeName="opacity" dur="1.1s" begin="0.74s" repeatCount="indefinite" values="1;1;0;0" keyTimes="0;0.5;0.5;1"/></tspan></text>
    <rect x="762" y="170" width="50" height="20" fill="#fff" stroke="#000" stroke-width="2.5"/>
    <text x="787" y="184" font-size="11" font-weight="700" fill="#000" text-anchor="middle">tls</text>
  </g>

  <!-- The panel frame -->
  <rect x="6" y="6" width="868" height="268" fill="none" stroke="#000" stroke-width="7"/>
  <rect x="18" y="18" width="844" height="244" fill="none" stroke="#000" stroke-width="2"/>
</svg>
