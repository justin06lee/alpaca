<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 280" width="880" height="280" role="img" aria-label="alpaca: a machine running ollama streaming tokens to client terminals over lan, tailnet, and tls">
  <title>alpaca — one machine serves the model, every other machine talks to it</title>

  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="55%" stop-color="#0E1626"/>
      <stop offset="100%" stop-color="#121C31"/>
    </linearGradient>

    <radialGradient id="glow" cx="22%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="cardFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#16213A"/>
      <stop offset="100%" stop-color="#111A2C"/>
    </linearGradient>

    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1" fill="#8FB3D9" fill-opacity="0.07"/>
    </pattern>
  </defs>

  <!-- backdrop -->
  <rect width="880" height="280" rx="18" fill="url(#panel)"/>
  <rect width="880" height="280" rx="18" fill="url(#dots)"/>
  <rect width="880" height="280" rx="18" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="879" height="279" rx="17.5" fill="none" stroke="#22304D"/>

  <!-- ─────────────  routes  ───────────── -->
  <!-- Faint rails, then tokens travelling along the identical path data. -->
  <g fill="none" stroke-width="1.5" stroke-dasharray="3 6" stroke-linecap="round">
    <path d="M280,140 C 420,140 490,74 624,74"  stroke="#34D399" stroke-opacity="0.36"/>
    <path d="M280,140 L 624,140"                stroke="#FBBF24" stroke-opacity="0.36"/>
    <path d="M280,140 C 420,140 490,206 624,206" stroke="#A78BFA" stroke-opacity="0.36"/>
  </g>

  <g>
    <!-- lan -->
    <circle r="3.6" opacity="0" fill="#34D399">
      <animateMotion dur="2.7s" begin="0s" repeatCount="indefinite" path="M280,140 C 420,140 490,74 624,74"/>
      <animate attributeName="opacity" dur="2.7s" begin="0s" repeatCount="indefinite"
               values="0;1;1;0" keyTimes="0;0.12;0.86;1"/>
    </circle>
    <circle r="3.6" opacity="0" fill="#34D399">
      <animateMotion dur="2.7s" begin="0.9s" repeatCount="indefinite" path="M280,140 C 420,140 490,74 624,74"/>
      <animate attributeName="opacity" dur="2.7s" begin="0.9s" repeatCount="indefinite"
               values="0;1;1;0" keyTimes="0;0.12;0.86;1"/>
    </circle>
    <circle r="3.6" opacity="0" fill="#34D399">
      <animateMotion dur="2.7s" begin="1.8s" repeatCount="indefinite" path="M280,140 C 420,140 490,74 624,74"/>
      <animate attributeName="opacity" dur="2.7s" begin="1.8s" repeatCount="indefinite"
               values="0;1;1;0" keyTimes="0;0.12;0.86;1"/>
    </circle>

    <!-- tailnet -->
    <circle r="3.6" opacity="0" fill="#FBBF24">
      <animateMotion dur="2.7s" begin="0.35s" repeatCount="indefinite" path="M280,140 L 624,140"/>
      <animate attributeName="opacity" dur="2.7s" begin="0.35s" repeatCount="indefinite"
               values="0;1;1;0" keyTimes="0;0.12;0.86;1"/>
    </circle>
    <circle r="3.6" opacity="0" fill="#FBBF24">
      <animateMotion dur="2.7s" begin="1.25s" repeatCount="indefinite" path="M280,140 L 624,140"/>
      <animate attributeName="opacity" dur="2.7s" begin="1.25s" repeatCount="indefinite"
               values="0;1;1;0" keyTimes="0;0.12;0.86;1"/>
    </circle>
    <circle r="3.6" opacity="0" fill="#FBBF24">
      <animateMotion dur="2.7s" begin="2.15s" repeatCount="indefinite" path="M280,140 L 624,140"/>
      <animate attributeName="opacity" dur="2.7s" begin="2.15s" repeatCount="indefinite"
               values="0;1;1;0" keyTimes="0;0.12;0.86;1"/>
    </circle>

    <!-- tls -->
    <circle r="3.6" opacity="0" fill="#A78BFA">
      <animateMotion dur="2.7s" begin="0.6s" repeatCount="indefinite" path="M280,140 C 420,140 490,206 624,206"/>
      <animate attributeName="opacity" dur="2.7s" begin="0.6s" repeatCount="indefinite"
               values="0;1;1;0" keyTimes="0;0.12;0.86;1"/>
    </circle>
    <circle r="3.6" opacity="0" fill="#A78BFA">
      <animateMotion dur="2.7s" begin="1.5s" repeatCount="indefinite" path="M280,140 C 420,140 490,206 624,206"/>
      <animate attributeName="opacity" dur="2.7s" begin="1.5s" repeatCount="indefinite"
               values="0;1;1;0" keyTimes="0;0.12;0.86;1"/>
    </circle>
    <circle r="3.6" opacity="0" fill="#A78BFA">
      <animateMotion dur="2.7s" begin="2.4s" repeatCount="indefinite" path="M280,140 C 420,140 490,206 624,206"/>
      <animate attributeName="opacity" dur="2.7s" begin="2.4s" repeatCount="indefinite"
               values="0;1;1;0" keyTimes="0;0.12;0.86;1"/>
    </circle>
  </g>

  <!-- ─────────────  the machine with the model  ───────────── -->
  <g>
    <rect x="56" y="84" width="224" height="112" rx="12" fill="url(#cardFace)" stroke="#2B3B5C"/>

    <!-- running indicator -->
    <circle cx="80" cy="113" r="4.5" fill="#34D399">
      <animate attributeName="opacity" dur="2.4s" repeatCount="indefinite"
               values="1;0.35;1" keyTimes="0;0.5;1"/>
    </circle>
    <circle cx="80" cy="113" r="4.5" fill="none" stroke="#34D399" stroke-opacity="0.5">
      <animate attributeName="r" dur="2.4s" repeatCount="indefinite" values="4.5;11;4.5"/>
      <animate attributeName="stroke-opacity" dur="2.4s" repeatCount="indefinite" values="0.5;0;0.5"/>
    </circle>

    <text x="96" y="118" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, system-ui, sans-serif"
          font-size="17" font-weight="600" fill="#E8EFFA">ollama</text>
    <text x="76" y="146" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace"
          font-size="12" fill="#7D8DA6">llama3.2:latest</text>
    <text x="76" y="174" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace"
          font-size="13" fill="#38BDF8">$ alpaca serve</text>
  </g>

  <!-- ─────────────  the other machines  ───────────── -->
  <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">
    <!-- lan -->
    <g>
      <rect x="624" y="48" width="200" height="52" rx="10" fill="url(#cardFace)" stroke="#2B3B5C"/>
      <circle cx="644" cy="74" r="3.5" fill="#34D399"/>
      <text x="658" y="78" font-size="12" fill="#C9D6E8">alpaca chat <tspan fill="#38BDF8">█<animate attributeName="opacity" dur="1.1s" begin="0s" repeatCount="indefinite" values="1;1;0;0" keyTimes="0;0.5;0.5;1"/></tspan></text>
      <text x="808" y="78" font-size="10.5" fill="#34D399" fill-opacity="0.85" text-anchor="end">lan</text>
    </g>

    <!-- tailnet -->
    <g>
      <rect x="624" y="114" width="200" height="52" rx="10" fill="url(#cardFace)" stroke="#2B3B5C"/>
      <circle cx="644" cy="140" r="3.5" fill="#FBBF24"/>
      <text x="658" y="144" font-size="12" fill="#C9D6E8">alpaca chat <tspan fill="#38BDF8">█<animate attributeName="opacity" dur="1.1s" begin="0.37s" repeatCount="indefinite" values="1;1;0;0" keyTimes="0;0.5;0.5;1"/></tspan></text>
      <text x="808" y="144" font-size="10.5" fill="#FBBF24" fill-opacity="0.85" text-anchor="end">tailnet</text>
    </g>

    <!-- tls -->
    <g>
      <rect x="624" y="180" width="200" height="52" rx="10" fill="url(#cardFace)" stroke="#2B3B5C"/>
      <circle cx="644" cy="206" r="3.5" fill="#A78BFA"/>
      <text x="658" y="210" font-size="12" fill="#C9D6E8">alpaca chat <tspan fill="#38BDF8">█<animate attributeName="opacity" dur="1.1s" begin="0.74s" repeatCount="indefinite" values="1;1;0;0" keyTimes="0;0.5;0.5;1"/></tspan></text>
      <text x="808" y="210" font-size="10.5" fill="#A78BFA" fill-opacity="0.85" text-anchor="end">tls</text>
    </g>
  </g>
</svg>
