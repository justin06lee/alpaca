<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-label="alpaca — the terminal sprite as a manga action panel">
  <title>alpaca</title>
  <!-- Manga panel: flat black ink on a white page. The animal is the TUI's
       own splash sprite, stamped instead of drawn — the terminal is the
       character. Speed lines arrive from the left (every other machine),
       broadcast arcs leave the head (the one that serves). -->

  <defs>
    <!-- Classic screentone: a coarse dot grid, never a gradient. -->
    <pattern id="tone" width="11" height="11" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.7" fill="#000"/>
    </pattern>
  </defs>

  <!-- The page -->
  <rect x="0" y="0" width="900" height="420" fill="#fff"/>

  <!-- Corner screentone, clipped by the panel border below -->
  <polygon points="16,16 400,16 16,170" fill="url(#tone)"/>
  <polygon points="884,404 884,250 560,404" fill="url(#tone)"/>

  <!-- Speed lines: tapering rules converging on the animal -->
  <g stroke="#000" stroke-linecap="round" fill="none">
    <path d="M 52 120 L 470 132" stroke-width="5"/>
    <path d="M 40 160 L 440 165" stroke-width="3"/>
    <path d="M 66 197 L 470 196" stroke-width="6"/>
    <path d="M 46 232 L 430 226" stroke-width="2.5"/>
    <path d="M 60 265 L 470 254" stroke-width="4"/>
  </g>

  <!-- Broadcast arcs off the head: the one machine that serves the rest -->
  <g stroke="#000" fill="none">
    <path d="M 520 92 A 34 34 0 0 0 520 148" stroke-width="5.5"/>
    <path d="M 496 78 A 56 56 0 0 0 496 162" stroke-width="4"/>
    <path d="M 472 64 A 78 78 0 0 0 472 176" stroke-width="2.5"/>
  </g>

  <!-- The sprite, inked. Eyes and muzzle read as white gaps in the black. -->
  <g transform="translate(560,64)" fill="#000">
      <rect x="26" y="0" width="13" height="13"/>
      <rect x="91" y="0" width="13" height="13"/>
      <rect x="26" y="13" width="26" height="13"/>
      <rect x="78" y="13" width="26" height="13"/>
      <rect x="13" y="26" width="104" height="13"/>
      <rect x="13" y="39" width="26" height="13"/>
      <rect x="52" y="39" width="26" height="13"/>
      <rect x="91" y="39" width="26" height="13"/>
      <rect x="13" y="52" width="104" height="13"/>
      <rect x="26" y="65" width="26" height="13"/>
      <rect x="78" y="65" width="26" height="13"/>
      <rect x="39" y="78" width="52" height="13"/>
      <rect x="52" y="91" width="39" height="13"/>
      <rect x="52" y="104" width="39" height="13"/>
      <rect x="65" y="117" width="39" height="13"/>
      <rect x="65" y="130" width="130" height="13"/>
      <rect x="52" y="143" width="169" height="13"/>
      <rect x="52" y="156" width="169" height="13"/>
      <rect x="65" y="169" width="143" height="13"/>
      <rect x="65" y="182" width="26" height="13"/>
      <rect x="104" y="182" width="26" height="13"/>
      <rect x="143" y="182" width="26" height="13"/>
      <rect x="182" y="182" width="26" height="13"/>
      <rect x="65" y="195" width="26" height="13"/>
      <rect x="104" y="195" width="26" height="13"/>
      <rect x="143" y="195" width="26" height="13"/>
      <rect x="182" y="195" width="26" height="13"/>
  </g>

  <!-- Ground: one hard rule plus hatch ticks, no horizon fuss -->
  <path d="M 90 276 L 852 276" stroke="#000" stroke-width="7" stroke-linecap="round"/>
  <g stroke="#000" stroke-width="2.5" stroke-linecap="round">
    <path d="M 140 290 L 122 306"/>
    <path d="M 240 290 L 222 306"/>
    <path d="M 350 290 L 332 306"/>
    <path d="M 700 290 L 682 306"/>
    <path d="M 800 290 L 782 306"/>
  </g>

  <!-- Wordmark -->
  <text x="64" y="372" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="76" font-weight="800" fill="#000" letter-spacing="2">alpaca</text>

  <!-- Panel border: heavy outer rule, hairline inner rule -->
  <rect x="14" y="14" width="872" height="392" fill="none" stroke="#000" stroke-width="7"/>
  <rect x="27" y="27" width="846" height="366" fill="none" stroke="#000" stroke-width="2"/>
</svg>
