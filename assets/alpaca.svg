<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 270 262" width="270" height="262" role="img" aria-label="an alpaca">
  <title>alpaca</title>

  <defs>
    <linearGradient id="wool" gradientUnits="userSpaceOnUse" x1="0" y1="10" x2="0" y2="248">
      <stop offset="0%" stop-color="#F9EFE1"/>
      <stop offset="100%" stop-color="#E2CDAF"/>
    </linearGradient>

    <!-- The whole animal is one shape list, declared once and painted twice
         (see below). Building the fleece from overlapping circles gives a
         scalloped, woolly silhouette far more reliably than hand-authoring
         the equivalent path arcs. -->
    <g id="silhouette">
      <rect x="122" y="176" width="17" height="58" rx="8.5"/>
      <rect x="148" y="180" width="17" height="54" rx="8.5"/>
      <rect x="178" y="180" width="17" height="54" rx="8.5"/>
      <rect x="204" y="176" width="17" height="58" rx="8.5"/>

      <ellipse cx="162" cy="152" rx="52" ry="40"/>
      <circle cx="113" cy="138" r="17"/>
      <circle cx="132" cy="119" r="18"/>
      <circle cx="162" cy="112" r="19"/>
      <circle cx="192" cy="119" r="18"/>
      <circle cx="211" cy="138" r="17"/>
      <circle cx="213" cy="164" r="16"/>
      <circle cx="192" cy="185" r="17"/>
      <circle cx="162" cy="192" r="17"/>
      <circle cx="132" cy="185" r="16"/>
      <circle cx="113" cy="166" r="16"/>

      <rect x="94.5" y="76" width="36" height="78" rx="18"
            transform="rotate(-26.6 112.5 115)"/>

      <ellipse cx="92" cy="64" rx="31" ry="28"/>
      <circle cx="68" cy="68" r="15"/>
      <circle cx="116" cy="68" r="15"/>
      <circle cx="76" cy="36" r="15"/>
      <circle cx="94" cy="29" r="16"/>
      <circle cx="111" cy="37" r="14"/>
    </g>
  </defs>

  <!-- ground shadow, breathing with the body -->
  <ellipse cx="166" cy="242" rx="74" ry="8.5" fill="#6B5642" fill-opacity="0.13">
    <animate attributeName="rx" values="74;70;74" keyTimes="0;0.5;1" dur="4.4s" repeatCount="indefinite"/>
    <animate attributeName="fill-opacity" values="0.13;0.10;0.13" dur="4.4s" repeatCount="indefinite"/>
  </ellipse>

  <g>
    <!-- one gentle bob for the whole animal, so no seam can open up -->
    <animateTransform attributeName="transform" type="translate" additive="sum"
                      values="0 0; 0 -3; 0 0" keyTimes="0;0.5;1"
                      dur="4.4s" repeatCount="indefinite"/>

    <!-- Ears sit behind the head so their bases vanish under the topknot.
         Short and triangular: long banana ears would read as a llama. -->
    <g stroke="#6B5642" stroke-width="3.2" stroke-linejoin="round">
      <g>
        <animateTransform attributeName="transform" type="rotate" additive="sum"
                          values="0 72 44; 0 72 44; -14 72 44; 5 72 44; 0 72 44; 0 72 44"
                          keyTimes="0;0.55;0.62;0.7;0.78;1" dur="6.4s" repeatCount="indefinite"/>
        <path d="M70,46 L59,7 L88,34 Z" fill="#F4E8D6"/>
        <path d="M71,39 L64,17 L83,34 Z" fill="#C99C90" stroke="none"/>
      </g>
      <g>
        <animateTransform attributeName="transform" type="rotate" additive="sum"
                          values="0 114 44; 0 114 44; 11 114 44; -4 114 44; 0 114 44; 0 114 44"
                          keyTimes="0;0.18;0.25;0.33;0.41;1" dur="6.4s" repeatCount="indefinite"/>
        <path d="M116,46 L127,7 L98,34 Z" fill="#F4E8D6"/>
        <path d="M115,39 L122,17 L103,34 Z" fill="#C99C90" stroke="none"/>
      </g>
    </g>

    <!-- Outline by offset. Painting the silhouette twice in the same order
         cannot work: the last shape drawn keeps its own full outline, since
         nothing is painted after it to cover the stroke. Instead the whole
         silhouette is drawn once as a solid dark blob widened by a thick
         stroke, then the cream fill lands on top: the union of the fills
         covers every interior pixel, and only the widened rim survives. -->
    <use href="#silhouette" fill="#6B5642" stroke="#6B5642" stroke-width="8.4"
         stroke-linejoin="round" stroke-linecap="round"/>
    <use href="#silhouette" fill="url(#wool)" stroke="url(#wool)" stroke-width="1.6"
         stroke-linejoin="round" stroke-linecap="round"/>

    <!-- hooves -->
    <g fill="#7C6650">
      <path d="M122,222 h17 v6 a8.5,8.5 0 0 1 -17,0 z"/>
      <path d="M148,222 h17 v6 a8.5,8.5 0 0 1 -17,0 z"/>
      <path d="M178,222 h17 v6 a8.5,8.5 0 0 1 -17,0 z"/>
      <path d="M204,222 h17 v6 a8.5,8.5 0 0 1 -17,0 z"/>
    </g>


    <!-- eyes -->
    <g fill="#4A3A2C">
      <ellipse cx="81" cy="62" rx="4.7" ry="5.9">
        <animate attributeName="ry" values="5.9;5.9;0.5;5.9" keyTimes="0;0.93;0.965;1"
                 dur="4.6s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="105" cy="62" rx="4.7" ry="5.9">
        <animate attributeName="ry" values="5.9;5.9;0.5;5.9" keyTimes="0;0.93;0.965;1"
                 dur="4.6s" repeatCount="indefinite"/>
      </ellipse>
    </g>
    <g fill="#FFFFFF" fill-opacity="0.9">
      <circle cx="82.7" cy="59.8" r="1.6"/>
      <circle cx="106.7" cy="59.8" r="1.6"/>
    </g>

    <!-- blunt muzzle, chewing -->
    <g>
      <animateTransform attributeName="transform" type="translate" additive="sum"
                        values="0 0; 0 1.4; 0 0; 0 1.2; 0 0; 0 0"
                        keyTimes="0;0.05;0.1;0.15;0.2;1" dur="3.4s" repeatCount="indefinite"/>
      <ellipse cx="93" cy="81" rx="18.5" ry="13.5" fill="#DDC2A2" stroke="#6B5642" stroke-width="3"/>
      <ellipse cx="87" cy="77" rx="2.2" ry="2.7" fill="#6B5642"/>
      <ellipse cx="99" cy="77" rx="2.2" ry="2.7" fill="#6B5642"/>
      <path d="M87,86 Q93,90 99,86" fill="none" stroke="#6B5642" stroke-width="2.6" stroke-linecap="round"/>
    </g>
  </g>
</svg>
