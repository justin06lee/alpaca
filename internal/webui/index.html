<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>alpaca</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'><rect width='120' height='120' fill='%230C0C0F'/><g shape-rendering='crispEdges'><rect x='30' y='30' width='10' height='10' fill='%23C98A6B'/><rect x='80' y='30' width='10' height='10' fill='%23C98A6B'/><rect x='30' y='40' width='20' height='10' fill='%23C98A6B'/><rect x='70' y='40' width='20' height='10' fill='%23C98A6B'/><rect x='20' y='50' width='80' height='10' fill='%23C98A6B'/><rect x='20' y='60' width='20' height='10' fill='%23C98A6B'/><rect x='40' y='60' width='10' height='10' fill='%232A2118'/><rect x='50' y='60' width='20' height='10' fill='%23C98A6B'/><rect x='70' y='60' width='10' height='10' fill='%232A2118'/><rect x='80' y='60' width='20' height='10' fill='%23C98A6B'/><rect x='20' y='70' width='80' height='10' fill='%23C98A6B'/><rect x='30' y='80' width='20' height='10' fill='%23C98A6B'/><rect x='50' y='80' width='20' height='10' fill='%23E4BA9B'/><rect x='70' y='80' width='20' height='10' fill='%23C98A6B'/></g></svg>">
<style>
  /* The TUI's pasture palette, on glass instead of cells. */
  :root {
    --bg:      #171310;
    --panel:   #1e1813;
    --raise:   #26201a;
    --line:    #382f26;
    --text:    #d8d2cb;
    --muted:   #8a7d6f;
    --faint:   #55493d;
    --accent:  #e0a177;  /* terracotta: the animal   */
    --user:    #b3986b;  /* hay: the human           */
    --model:   #d9a283;  /* warm wool: the model     */
    --warn:    #e0c08a;
    --error:   #d98a72;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font: 14px/1.55 var(--mono);
    display: grid; grid-template-columns: 264px 1fr;
    overflow: hidden;
  }

  /* ── sidebar ─────────────────────────────────────────────── */
  aside {
    background: var(--panel); border-right: 1px solid var(--line);
    display: flex; flex-direction: column; min-width: 0;
  }
  .brand {
    padding: 18px 18px 14px; display: flex; align-items: center; gap: 10px;
  }
  .brand svg { display: block; flex: none; }
  .brand b { color: var(--accent); font-size: 18px; letter-spacing: 1px; }
  .brand span { color: var(--faint); font-size: 11px; }
  .newchat {
    margin: 0 14px 10px; padding: 9px 12px;
    background: none; border: 1px solid var(--line); border-radius: 8px;
    color: var(--accent); font: inherit; cursor: pointer; text-align: left;
  }
  .newchat:hover { border-color: var(--accent); }
  nav { flex: 1; overflow-y: auto; padding: 2px 8px; }
  .chat-item {
    position: relative; padding: 8px 26px 8px 10px; border-radius: 8px;
    cursor: pointer; margin: 2px 0;
  }
  .chat-item:hover { background: var(--raise); }
  .chat-item.active { background: var(--raise); box-shadow: inset 2px 0 0 var(--accent); }
  .chat-item .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chat-item .m { color: var(--faint); font-size: 11px; }
  .chat-item .del {
    position: absolute; right: 6px; top: 8px; display: none;
    background: none; border: 0; color: var(--faint); font: inherit; cursor: pointer;
  }
  .chat-item:hover .del { display: block; }
  .chat-item .del:hover { color: var(--error); }
  .side-foot {
    padding: 12px 18px; border-top: 1px solid var(--line);
    color: var(--faint); font-size: 11px; line-height: 1.5;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .side-foot .dot { color: var(--accent); }
  .side-foot .dot.err { color: var(--error); }

  /* ── main column ─────────────────────────────────────────── */
  main { display: flex; flex-direction: column; min-width: 0; }
  header {
    display: flex; align-items: center; gap: 14px;
    padding: 12px 22px; border-bottom: 1px solid var(--line);
  }
  header select {
    background: var(--raise); color: var(--text); font: inherit;
    border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px;
    max-width: 340px;
  }
  header .stats { margin-left: auto; color: var(--faint); font-size: 12px; }

  #scroll { flex: 1; overflow-y: auto; }
  #pane { max-width: 860px; margin: 0 auto; padding: 26px 26px 8px; }

  .turn-user { display: flex; justify-content: flex-end; margin: 14px 0; }
  .turn-user .bubble {
    max-width: 68%; padding: 8px 14px; white-space: pre-wrap;
    border: 1px solid var(--user); border-radius: 12px;
  }
  .turn-model { margin: 18px 0; }
  .turn-model .label { color: var(--model); font-weight: 700; margin-bottom: 8px; }
  .turn-model .label::before { content: "▌ "; }
  .turn-note { color: var(--accent); font-size: 12.5px; margin: 8px 0; }
  .turn-note::before { content: "⌕ "; }
  .turn-ctx { color: var(--warn); font-style: italic; margin: 14px 0; white-space: pre-wrap; }
  .turn-ctx::before { content: "◈ context\A"; white-space: pre; font-style: normal; }

  /* rendered markdown */
  .md p, .md ul, .md ol, .md blockquote, .md h1, .md h2, .md h3 { margin: 0 0 10px; }
  .md h1, .md h2, .md h3 { color: var(--accent); font-size: 15px; }
  .md ul, .md ol { padding-left: 22px; }
  .md a { color: var(--accent); }
  .md blockquote { border-left: 3px solid var(--faint); padding-left: 12px; color: var(--muted); }
  .md code { background: var(--raise); padding: 1px 5px; border-radius: 5px; }
  .codeblock { border: 1px solid var(--line); border-radius: 10px; margin: 0 0 12px; overflow: hidden; }
  .codeblock .bar {
    display: flex; justify-content: space-between; padding: 5px 12px;
    background: var(--raise); color: var(--muted); font-size: 12px;
  }
  .codeblock .bar button {
    background: none; border: 0; color: var(--accent); font: inherit; cursor: pointer;
  }
  .codeblock pre { padding: 12px; overflow-x: auto; }
  .codeblock code { background: none; padding: 0; }

  /* welcome / states */
  .center { height: 100%; display: flex; flex-direction: column; gap: 14px;
            align-items: center; justify-content: center; color: var(--muted); }
  .center .art { color: var(--accent); font-size: 12px; line-height: 1.15; white-space: pre; }
  .center button {
    background: none; border: 1px solid var(--line); border-radius: 8px;
    color: var(--accent); font: inherit; padding: 8px 16px; cursor: pointer;
  }
  .center .err { color: var(--error); max-width: 560px; text-align: center; }

  /* thinking */
  .thinking { color: var(--muted); }
  .thinking::after { content: "…"; animation: think 1.2s steps(4) infinite; }
  @keyframes think { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }

  /* ── composer ────────────────────────────────────────────── */
  .compose { padding: 10px 22px 16px; }
  .compose-box {
    max-width: 860px; margin: 0 auto; display: flex; align-items: flex-end; gap: 10px;
    border: 1px solid var(--accent); border-radius: 12px; padding: 10px 12px;
    background: var(--panel);
  }
  .compose-box.busy { border-color: var(--faint); }
  textarea {
    flex: 1; background: none; border: 0; outline: none; resize: none;
    color: var(--text); font: inherit; max-height: 200px;
  }
  .compose button {
    background: none; border: 1px solid var(--line); border-radius: 8px;
    color: var(--accent); font: inherit; padding: 6px 14px; cursor: pointer;
  }
  .compose button:hover { border-color: var(--accent); }
  .compose button.stop { color: var(--error); }
  .hint { max-width: 860px; margin: 6px auto 0; color: var(--faint); font-size: 11px; }
  #toast {
    position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%);
    background: var(--raise); border: 1px solid var(--line); border-radius: 10px;
    padding: 8px 16px; display: none; max-width: 70%;
  }
  #toast.err { color: var(--error); }
</style>
</head>
<body>
  <aside>
    <div class="brand"><svg width="24" height="18" viewBox="0 0 80 60" shape-rendering="crispEdges" aria-hidden="true"><rect x="10" y="0" width="10" height="10" fill="#C98A6B"/><rect x="60" y="0" width="10" height="10" fill="#C98A6B"/><rect x="10" y="10" width="20" height="10" fill="#C98A6B"/><rect x="50" y="10" width="20" height="10" fill="#C98A6B"/><rect x="0" y="20" width="80" height="10" fill="#C98A6B"/><rect x="0" y="30" width="20" height="10" fill="#C98A6B"/><rect x="20" y="30" width="10" height="10" fill="#2A2118"/><rect x="30" y="30" width="20" height="10" fill="#C98A6B"/><rect x="50" y="30" width="10" height="10" fill="#2A2118"/><rect x="60" y="30" width="20" height="10" fill="#C98A6B"/><rect x="0" y="40" width="80" height="10" fill="#C98A6B"/><rect x="10" y="50" width="20" height="10" fill="#C98A6B"/><rect x="30" y="50" width="20" height="10" fill="#E4BA9B"/><rect x="50" y="50" width="20" height="10" fill="#C98A6B"/></svg><b>alpaca</b><span id="version"></span></div>
    <button class="newchat" id="newchat">+ new chat</button>
    <nav id="chats"></nav>
    <div class="side-foot"><span class="dot" id="statusdot">●</span> <span id="serverline">connecting…</span></div>
  </aside>

  <main>
    <header>
      <select id="model"></select>
      <div class="stats" id="stats"></div>
    </header>
    <div id="scroll"><div id="pane"></div></div>
    <div class="compose">
      <div class="compose-box" id="composebox">
        <textarea id="input" rows="1" placeholder="Ask anything…"></textarea>
        <button id="send">send</button>
      </div>
      <div class="hint">enter to send · shift+enter for a newline</div>
    </div>
  </main>
  <div id="toast"></div>

<script>
"use strict";
const TOKEN   = "__ALPACA_TOKEN__";
const SERVER  = "__ALPACA_SERVER__";
const VERSION = "__ALPACA_VERSION__";

const $ = (id) => document.getElementById(id);
const headers = { "Authorization": "Bearer " + TOKEN, "Content-Type": "application/json" };

const state = {
  ready: false,
  sessionId: "",     // empty until the first reply names one
  messages: [],      // {role, content}
  chats: [],
  streaming: false,
  abort: null,
};

const THINKING = ["Ruminating", "Wool-gathering", "Humming", "Chewing it over",
  "Grazing", "Pondering", "Mulling", "Herding thoughts", "Spinning yarn"];
const GREETINGS = ["What are we chewing over today?", "The herd is listening.",
  "Ask me something.", "Fresh pasture. What's on your mind?", "Ready when you are.",
  "Say the word.", "All ears, and there are two of them."];
const greeting = GREETINGS[Math.floor(Math.random() * GREETINGS.length)];

const ART = [
  "  ▟▖ ▟▖",
  "  █████▙",
  "  ▜███▛",
  "   ██▙▄▄▄▄▖",
  "   ████████▌",
  "   █▘ █▘█▘█▘",
].join("\n");

/* ── tiny markdown ─────────────────────────────────────────── */
function esc(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function inline(s) {
  return s
    .replace(/`([^`]+)`/g, (_, c) => "<code>" + c + "</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
    .replace(/(^|\W)\*([^*\n]+)\*(?=\W|$)/g, "$1<i>$2</i>")
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,
      '<a href="$2" target="_blank" rel="noopener">$1</a>');
}
// Renders the subset of markdown a chat reply actually uses: fenced code,
// headings, lists, quotes, emphasis. Everything is escaped first.
function renderMD(text) {
  const out = [];
  const lines = text.split("\n");
  let i = 0, list = null, para = [];
  const flushPara = () => {
    if (para.length) { out.push("<p>" + inline(esc(para.join("\n"))) + "</p>"); para = []; }
  };
  const flushList = () => {
    if (list) { out.push("<" + list.tag + ">" + list.items.map(x => "<li>" + x + "</li>").join("") + "</" + list.tag + ">"); list = null; }
  };
  while (i < lines.length) {
    const line = lines[i];
    const fence = line.match(/^\s*(```|~~~)\s*(\S*)/);
    if (fence) {
      flushPara(); flushList();
      const lang = fence[2] || "code";
      const body = [];
      i++;
      while (i < lines.length && !/^\s*(```|~~~)/.test(lines[i])) { body.push(lines[i]); i++; }
      i++; // closing fence (or end of an unterminated one)
      out.push(
        '<div class="codeblock"><div class="bar"><span>' + esc(lang) +
        '</span><button onclick="copyCode(this)">⧉ copy</button></div><pre><code>' +
        esc(body.join("\n")) + "</code></pre></div>");
      continue;
    }
    const h = line.match(/^(#{1,3})\s+(.*)/);
    const li = line.match(/^\s*([-*]|\d+\.)\s+(.*)/);
    if (h) {
      flushPara(); flushList();
      out.push("<h" + h[1].length + ">" + inline(esc(h[2])) + "</h" + h[1].length + ">");
    } else if (li) {
      flushPara();
      const tag = /[-*]/.test(li[1]) ? "ul" : "ol";
      if (!list || list.tag !== tag) { flushList(); list = { tag, items: [] }; }
      list.items.push(inline(esc(li[2])));
    } else if (/^\s*>\s?/.test(line)) {
      flushPara(); flushList();
      out.push("<blockquote>" + inline(esc(line.replace(/^\s*>\s?/, ""))) + "</blockquote>");
    } else if (line.trim() === "") {
      flushPara(); flushList();
    } else {
      para.push(line);
    }
    i++;
  }
  flushPara(); flushList();
  return out.join("");
}
function copyCode(btn) {
  const code = btn.closest(".codeblock").querySelector("code").textContent;
  navigator.clipboard.writeText(code).then(() => {
    btn.textContent = "✓ copied!";
    setTimeout(() => { btn.textContent = "⧉ copy"; }, 1600);
  });
}

/* ── transcript ────────────────────────────────────────────── */
function atBottom() {
  const el = $("scroll");
  return el.scrollHeight - el.scrollTop - el.clientHeight < 60;
}
function scrollDown(force) {
  const el = $("scroll");
  if (force || atBottom()) el.scrollTop = el.scrollHeight;
}
function drawTranscript() {
  const pane = $("pane");
  if (!state.messages.length && !state.streaming) {
    pane.innerHTML =
      '<div class="center" style="height:60vh"><div class="art">' + esc(ART) +
      "</div><div>" + esc(greeting) + "</div></div>";
    return;
  }
  pane.innerHTML = "";
  for (const msg of state.messages) pane.appendChild(turnEl(msg));
}
function turnEl(msg) {
  const div = document.createElement("div");
  if (msg.role === "user") {
    div.className = "turn-user";
    const b = document.createElement("div");
    b.className = "bubble";
    b.textContent = msg.content;
    div.appendChild(b);
  } else if (msg.role === "system") {
    div.className = "turn-ctx";
    div.textContent = msg.content;
  } else {
    div.className = "turn-model";
    div.innerHTML = '<div class="label"></div><div class="md"></div>';
    div.querySelector(".label").textContent = currentModel();
    div.querySelector(".md").innerHTML = renderMD(msg.content);
  }
  return div;
}

/* ── sidebar ───────────────────────────────────────────────── */
function ago(iso) {
  const d = (Date.now() - new Date(iso).getTime()) / 1000;
  if (d < 60) return "just now";
  if (d < 3600) return Math.floor(d / 60) + "m ago";
  if (d < 86400) return Math.floor(d / 3600) + "h ago";
  return Math.floor(d / 86400) + "d ago";
}
function drawChats() {
  const nav = $("chats");
  nav.innerHTML = "";
  for (const chat of state.chats) {
    const div = document.createElement("div");
    div.className = "chat-item" + (chat.id === state.sessionId ? " active" : "");
    div.innerHTML = '<div class="t"></div><div class="m"></div><button class="del" title="delete">×</button>';
    div.querySelector(".t").textContent = chat.title;
    div.querySelector(".m").textContent = ago(chat.updated) + " · " + chat.messages + " msgs";
    div.onclick = () => openChat(chat.id);
    div.querySelector(".del").onclick = (e) => { e.stopPropagation(); deleteChat(chat); };
    nav.appendChild(div);
  }
}
async function openChat(id) {
  if (state.streaming) return toast("wait for the reply to finish", true);
  const res = await fetch("/api/sessions/" + id, { headers });
  if (!res.ok) return toast("could not open that chat", true);
  const sess = await res.json();
  state.sessionId = sess.id;
  state.messages = sess.messages || [];
  if (sess.model) $("model").value = sess.model;
  drawChats(); drawTranscript(); scrollDown(true);
}
async function deleteChat(chat) {
  if (chat.id === state.sessionId) return toast("that chat is open — switch away first", true);
  await fetch("/api/sessions/" + chat.id, { method: "DELETE", headers });
  state.chats = state.chats.filter(c => c.id !== chat.id);
  drawChats();
}
function newChat() {
  if (state.streaming) return toast("wait for the reply to finish", true);
  state.sessionId = "";
  state.messages = [];
  drawChats(); drawTranscript();
  $("input").focus();
}

/* ── sending ───────────────────────────────────────────────── */
function currentModel() { return $("model").value; }

async function send() {
  const text = $("input").value.trim();
  if (!text || state.streaming || !state.ready) return;
  if (!currentModel()) return toast("no model selected yet", true);

  $("input").value = "";
  autoGrow();
  state.messages.push({ role: "user", content: text });
  drawTranscript();

  const pane = $("pane");
  const live = document.createElement("div");
  live.className = "turn-model";
  live.innerHTML = '<div class="label"></div><div class="notes"></div>' +
    '<div class="thinking">' + esc(THINKING[Math.floor(Math.random() * THINKING.length)]) + "</div>" +
    '<div class="md"></div>';
  live.querySelector(".label").textContent = currentModel();
  pane.appendChild(live);
  scrollDown(true);

  state.streaming = true;
  state.abort = new AbortController();
  setBusy(true);

  let reply = "", usage = null, finalErr = null;
  try {
    const res = await fetch("/api/chat", {
      method: "POST", headers, signal: state.abort.signal,
      body: JSON.stringify({ session_id: state.sessionId, model: currentModel(), text }),
    });
    if (!res.ok) throw new Error(await res.text());

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = "";
    let paint = 0;
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      let nl;
      while ((nl = buf.indexOf("\n")) >= 0) {
        const line = buf.slice(0, nl); buf = buf.slice(nl + 1);
        if (!line.trim()) continue;
        const ev = JSON.parse(line);
        if (ev.type === "session") { state.sessionId = ev.id; }
        else if (ev.type === "delta") {
          reply += ev.content;
          live.querySelector(".thinking")?.remove();
          // Repaint at most ~12×/s: markdown over the whole reply per token
          // would chew the tab on fast models.
          const now = performance.now();
          if (now - paint > 80) {
            paint = now;
            live.querySelector(".md").innerHTML = renderMD(reply);
            scrollDown(false);
          }
        }
        else if (ev.type === "note") {
          const n = document.createElement("div");
          n.className = "turn-note"; n.textContent = ev.text;
          live.querySelector(".notes").appendChild(n);
        }
        else if (ev.type === "usage") { usage = ev; }
        else if (ev.type === "error") { finalErr = ev.error; }
      }
    }
  } catch (err) {
    if (err.name !== "AbortError") finalErr = String(err.message || err);
  }

  state.streaming = false;
  state.abort = null;
  setBusy(false);

  live.querySelector(".thinking")?.remove();
  live.querySelector(".md").innerHTML = renderMD(reply);
  if (reply) state.messages.push({ role: "assistant", content: reply });
  else live.remove();
  if (finalErr) toast(finalErr, true);
  if (usage) $("stats").textContent = usage.prompt + "→" + usage.reply + " tokens";
  scrollDown(false);
  refreshChats();
  $("input").focus();
}

function stop() { state.abort?.abort(); }

function setBusy(busy) {
  $("composebox").classList.toggle("busy", busy);
  const btn = $("send");
  btn.textContent = busy ? "stop" : "send";
  btn.classList.toggle("stop", busy);
  $("input").disabled = busy;
}

/* ── boot ──────────────────────────────────────────────────── */
function toast(text, isErr) {
  const el = $("toast");
  el.textContent = text;
  el.className = isErr ? "err" : "";
  el.style.display = "block";
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => { el.style.display = "none"; }, 4200);
}

async function refreshChats() {
  try {
    const res = await fetch("/api/boot", { headers });
    const boot = await res.json();
    state.chats = boot.chats || [];
    drawChats();
  } catch {}
}

async function boot() {
  $("version").textContent = VERSION;
  let announced = false;
  for (;;) {
    let boot;
    try {
      const res = await fetch("/api/boot", { headers });
      boot = await res.json();
    } catch {
      await new Promise(r => setTimeout(r, 800));
      continue;
    }
    state.chats = boot.chats || [];
    drawChats();

    if (boot.status === "ready") {
      state.ready = true;
      $("statusdot").className = "dot";
      $("serverline").textContent = boot.server + " · " + (boot.route || "");
      const select = $("model");
      select.innerHTML = "";
      for (const m of boot.models || []) {
        const opt = document.createElement("option");
        opt.value = m.id; opt.textContent = m.id;
        select.appendChild(opt);
      }
      if (boot.model) select.value = boot.model;
      drawTranscript();
      $("input").focus();
      return;
    }
    if (boot.status === "error") {
      $("statusdot").className = "dot err";
      $("serverline").textContent = "not connected";
      $("pane").innerHTML =
        '<div class="center" style="height:60vh"><div class="art">' + esc(ART) + "</div>" +
        '<div class="err">' + esc(boot.error) + "</div>" +
        '<button onclick="retry()">try again</button></div>';
      return;
    }
    if (!announced) {
      announced = true;
      $("pane").innerHTML =
        '<div class="center" style="height:60vh"><div class="art">' + esc(ART) +
        '</div><div class="thinking">connecting to ' + esc(SERVER) + "</div></div>";
    }
    await new Promise(r => setTimeout(r, 600));
  }
}
async function retry() {
  await fetch("/api/retry", { method: "POST", headers });
  boot();
}

/* ── wiring ────────────────────────────────────────────────── */
function autoGrow() {
  const el = $("input");
  el.style.height = "auto";
  el.style.height = Math.min(el.scrollHeight, 200) + "px";
}
$("input").addEventListener("input", autoGrow);
$("input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});
$("send").addEventListener("click", () => (state.streaming ? stop() : send()));
$("newchat").addEventListener("click", newChat);

// The heartbeat is what lets a Dock-launched alpaca notice the window is
// gone and put itself away.
setInterval(() => { fetch("/api/ping", { method: "POST", headers }).catch(() => {}); }, 10000);

boot();
</script>
